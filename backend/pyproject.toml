[project]
name = "eolian-backend"
version = "0.1.0"
description = "Backend for Eolian"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "sqlalchemy>=2.0",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "httpx>=0.28",
  "python-dotenv>=1.1",
  "pydantic-settings>=2.14.2",
  "firebase-admin>=7.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "basedpyright>=1.31",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

fixable = ["ALL"]
